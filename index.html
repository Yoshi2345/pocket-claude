<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Claude</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main id="log"></main>

<form id="keyForm" hidden>
  <input id="key" type="password" placeholder="APIキー（sk-ant-…）" autocomplete="off">
  <button>保存</button>
</form>

<form id="chatForm">
  <input id="input" type="text" placeholder="メッセージ" enterkeyhint="send" autocomplete="off">
  <button>送信</button>
</form>
</body>
</html>
